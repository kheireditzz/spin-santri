<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spin Santri - Wheel of Names Modern</title>
  
  <!-- Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-body: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --border-light: #E2E8F0;
      --border-strong: #CBD5E1;
      
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --primary-shadow: rgba(79, 70, 229, 0.2);
      
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;

      --danger: #EF4444;
      --danger-light: #FEF2F2;
      --danger-hover: #DC2626;

      --success: #10B981;
      --success-light: #ECFDF5;

      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 16px 36px -4px rgba(15, 23, 42, 0.1);

      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Mencegah scroll horizontal dan layar goyang/geser */
    html {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      max-width: 100%;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Navbar */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      padding: 0.85rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
      width: 100%;
    }

    .navbar-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      display: grid;
      place-items: center;
      color: white;
      box-shadow: 0 4px 10px var(--primary-shadow);
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .brand-text h1 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: var(--font-display);
      border: 1px solid rgba(79, 70, 229, 0.15);
      flex-shrink: 0;
    }

    .header-pill svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 860px) {
      main {
        grid-template-columns: 1.1fr 0.9fr;
        padding: 2rem 1.5rem;
        gap: 2rem;
      }
    }

    /* Card Wrapper */
    .wheel-card, .control-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      width: 100%;
    }

    .wheel-card {
      padding: 1.5rem 1rem 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Wheel Container Terkunci di dalam batasan card */
    .wheel-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.75rem auto 1.5rem;
    }

    /* Jarum Penunjuk di Atas Roda */
    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 44px;
      z-index: 25;
      filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.2));
      pointer-events: none;
    }

    .wheel-pointer path {
      fill: #EF4444;
      stroke: #FFFFFF;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }

    .wheel-canvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      border-radius: 50%;
      box-shadow: 0 0 0 8px #FFFFFF, 0 8px 28px rgba(15, 23, 42, 0.1);
      transition: transform 4.5s cubic-bezier(0.12, 0.85, 0.2, 1);
      touch-action: none;
      display: block;
    }

    .wheel-center {
      position: absolute;
      width: 52px;
      height: 52px;
      background: #FFFFFF;
      border: 4px solid var(--primary);
      border-radius: 50%;
      z-index: 20;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .wheel-center:hover {
      transform: scale(1.08);
      border-color: var(--primary-hover);
    }

    .wheel-center svg {
      width: 18px;
      height: 18px;
      fill: var(--primary);
    }

    .btn-spin-action {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      color: #FFFFFF;
      border: none;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: -0.01em;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 16px var(--primary-shadow);
      transition: all 0.2s ease;
    }

    .btn-spin-action:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
    }

    .btn-spin-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-spin-action svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Right Card Controls */
    .control-card {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: fit-content;
    }

    .tabs-nav {
      display: flex;
      background: var(--bg-subtle);
      padding: 0.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      width: 100%;
    }

    .tab-trigger {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: var(--font-display);
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .tab-trigger svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .tab-trigger.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .tab-pane.active {
      display: flex;
    }

    /* Add Form */
    .add-bar {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .input-santri {
      flex: 1;
      min-width: 0; /* Mencegah flex item melebihi container */
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-light);
      padding: 0.75rem 0.95rem;
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: var(--font-body);
      outline: none;
      transition: all 0.2s;
    }

    .input-santri:focus {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-shadow);
    }

    .btn-submit-add {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 0.75rem 1.1rem;
      border-radius: 10px;
      font-weight: 700;
      font-family: var(--font-display);
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-submit-add svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .btn-submit-add:hover {
      background: var(--primary-hover);
    }

    /* Scrollable areas */
    .scroll-area {
      max-height: 380px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 0.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      width: 100%;
    }

    .scroll-area::-webkit-scrollbar {
      width: 5px;
    }
    .scroll-area::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 9999px;
    }

    .santri-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      transition: all 0.15s ease;
      width: 100%;
    }

    .santri-row:hover {
      border-color: var(--border-strong);
    }

    .santri-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .color-chip {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .santri-title {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-actions {
      display: flex;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .icon-action-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s;
    }

    .icon-action-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .icon-action-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .icon-action-btn.btn-delete:hover {
      background: var(--danger-light);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }

    /* History Items */
    .history-card {
      padding: 0.75rem 0.95rem;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .hist-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary);
      margin-bottom: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .hist-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .hist-chip {
      background: var(--success-light);
      color: var(--success);
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.68rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .hist-chip svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    .history-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .btn-clear-all {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear-all:hover {
      background: var(--danger-light);
      color: var(--danger);
    }

    .empty-placeholder {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-light);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .empty-placeholder svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      opacity: 0.4;
    }

    /* Modal Dialog */
    .backdrop-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      max-width: 100vw;
    }

    .backdrop-modal.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: zoomIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-trophy-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #FEF3C7;
      color: #D97706;
      display: grid;
      place-items: center;
      margin: 0 auto 1rem;
    }

    .modal-trophy-icon svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .modal-subhead {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .modal-name {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 0.4rem;
      word-break: break-word;
    }

    .modal-time-detail {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .modal-btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .modal-btn-group button {
      flex: 1;
      padding: 0.8rem 0.5rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      font-family: var(--font-display);
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-keep {
      background: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-light) !important;
    }

    .btn-keep:hover {
      background: #E2E8F0;
    }

    .btn-eject {
      background: var(--danger);
      color: #FFFFFF;
    }

    .btn-eject:hover {
      background: var(--danger-hover);
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header>
    <div class="navbar-container">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 17.93V15a1 1 0 0 0-2 0v4.93A8 8 0 0 1 4.07 13H9a1 1 0 0 0 0-2H4.07A8 8 0 0 1 11 4.07V9a1 1 0 0 0 2 0V4.07A8 8 0 0 1 19.93 11H15a1 1 0 0 0 0 2h4.93A8 8 0 0 1 13 19.93z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Spin Santri</h1>
          <p>Acak Nama Santri Otomatis & Adil</p>
        </div>
      </div>
      <div class="header-pill">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span id="badgeCount">21 Santri</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main>
    <!-- Left Column: Wheel Picker -->
    <section class="wheel-card">
      <div class="wheel-wrapper">
        <!-- Jarum Atas (Pointing Downwards into Wheel) -->
        <svg class="wheel-pointer" viewBox="0 0 36 48">
          <path d="M18 46 L34 8 A 4 4 0 0 0 30 2 L6 2 A 4 4 0 0 0 2 8 Z" />
        </svg>

        <canvas id="wheelCanvas" class="wheel-canvas" width="600" height="600"></canvas>
        
        <!-- Center Hub -->
        <div class="wheel-center" id="centerPinBtn" title="Putar Roda">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>

      <button id="spinBtn" class="btn-spin-action">
        <svg viewBox="0 0 24 24">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        PUTAR RODA SEKARANG
      </button>
    </section>

    <!-- Right Column: Navigation Controls & History -->
    <aside class="control-card">
      <div class="tabs-nav">
        <button class="tab-trigger active" data-tab="tabSantri">
          <svg viewBox="0 0 24 24">
            <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
          </svg>
          Daftar Santri
        </button>
        <button class="tab-trigger" data-tab="tabRiwayat">
          <svg viewBox="0 0 24 24">
            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
          </svg>
          Riwayat Undian
        </button>
      </div>

      <!-- Tab: Daftar Santri -->
      <div id="tabSantri" class="tab-pane active">
        <form id="addSantriForm" class="add-bar">
          <input 
            type="text" 
            id="santriInput" 
            class="input-santri" 
            placeholder="Ketik nama santri..." 
            autocomplete="off"
            required
          />
          <button type="submit" class="btn-submit-add">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Tambah
          </button>
        </form>

        <div class="scroll-area" id="santriListContainer">
          <!-- Diisi otomatis lewat JS -->
        </div>
      </div>

      <!-- Tab: Riwayat Undian -->
      <div id="tabRiwayat" class="tab-pane">
        <div class="history-top-bar">
          <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Urutan Pemenang</span>
          <button id="clearHistoryBtn" class="btn-clear-all">Bersihkan Riwayat</button>
        </div>
        <div class="scroll-area" id="historyListContainer">
          <!-- Diisi otomatis lewat JS -->
        </div>
      </div>
    </aside>
  </main>

  <!-- Winner Dialog Modal -->
  <div id="winnerModal" class="backdrop-modal">
    <div class="modal-card">
      <div class="modal-trophy-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
        </svg>
      </div>
      <div class="modal-subhead">Hasil Putaran</div>
      <div class="modal-name" id="winnerNameDisplay">-</div>
      <div class="modal-time-detail" id="winnerTimeDisplay">-</div>
      <div class="modal-btn-group">
        <button id="modalCloseBtn" class="btn-keep">Tutup</button>
        <button id="modalRemoveBtn" class="btn-eject">Keluarkan Santri</button>
      </div>
    </div>
  </div>

  <script>
    const initialNames = [
      "M Rizki",
      "Abdul Samad",
      "M Azis",
      "Yusrizal",
      "Al fathir",
      "M Rizki Al fatan",
      "Husni Mubarak",
      "M Riski",
      "Jundi Hafizallah",
      "M fahrevi",
      "Zunuwanis",
      "Raisul Ahsan",
      "Muammar",
      "M Rasya Arrida",
      "Harisul Akmal",
      "Rifqi Maulana",
      "Muhammad Ibral",
      "Zainul Mubarraq",
      "Fairuzi Ramadhan",
      "Khusairi",
      "Saibatul Safri"
    ];

    const modernPalette = [
      "#4F46E5", "#0EA5E9", "#10B981", "#F59E0B", "#EC4899",
      "#8B5CF6", "#06B6D4", "#F97316", "#14B8A6", "#6366F1",
      "#3B82F6", "#84CC16", "#E11D48", "#0284C7", "#D97706"
    ];

    const LS_SANTRI_KEY = "spin_santri_fixed_list";
    const LS_HISTORY_KEY = "spin_santri_fixed_history";

    let santriList = [];
    let historyList = [];
    let isSpinning = false;
    let currentRotation = 0;
    let activeWinnerIndex = -1;

    function loadData() {
      const savedNames = localStorage.getItem(LS_SANTRI_KEY);
      santriList = savedNames ? JSON.parse(savedNames) : [...initialNames];

      const savedHistory = localStorage.getItem(LS_HISTORY_KEY);
      historyList = savedHistory ? JSON.parse(savedHistory) : [];
    }

    function saveData() {
      localStorage.setItem(LS_SANTRI_KEY, JSON.stringify(santriList));
      localStorage.setItem(LS_HISTORY_KEY, JSON.stringify(historyList));
      updateBadge();
    }

    function updateBadge() {
      document.getElementById("badgeCount").textContent = `${santriList.length} Santri`;
    }

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    function drawWheel() {
      const numSegments = santriList.length;
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSegments === 0) {
        ctx.save();
        ctx.fillStyle = "#F1F5F9";
        ctx.beginPath();
        ctx.arc(radius, radius, radius - 4, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = "#94A3B8";
        ctx.font = "bold 20px 'Plus Jakarta Sans', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Tambahkan Nama Santri", radius, radius);
        ctx.restore();
        return;
      }

      const arc = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const startAngle = i * arc;
        const color = modernPalette[i % modernPalette.length];

        ctx.save();
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 4, startAngle, startAngle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        // Slice borders
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Label text
        ctx.translate(radius, radius);
        ctx.rotate(startAngle + arc / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#FFFFFF";

        const fontSize = Math.max(12, Math.min(18, Math.floor(400 / numSegments)));
        ctx.font = `700 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;

        let label = santriList[i];
        if (label.length > 18) label = label.substring(0, 16) + "…";

        ctx.fillText(label, radius - 24, 0);
        ctx.restore();
      }
    }

    function renderSantriList() {
      const container = document.getElementById("santriListContainer");
      container.innerHTML = "";

      if (santriList.length === 0) {
        container.innerHTML = `
          <div class="empty-placeholder">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>Daftar santri kosong.</span>
          </div>
        `;
        return;
      }

      santriList.forEach((name, index) => {
        const color = modernPalette[index % modernPalette.length];
        const row = document.createElement("div");
        row.className = "santri-row";
        row.innerHTML = `
          <div class="santri-info">
            <span class="color-chip" style="background: ${color};"></span>
            <span class="santri-title" title="${name}">${name}</span>
          </div>
          <div class="row-actions">
            <button class="icon-action-btn" onclick="editSantri(${index})" title="Ubah Nama">
              <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <button class="icon-action-btn btn-delete" onclick="deleteSantri(${index})" title="Hapus">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function renderHistoryList() {
      const container = document.getElementById("historyListContainer");
      container.innerHTML = "";

      if (historyList.length === 0) {
        container.innerHTML = `
          <div class="empty-placeholder">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span>Belum ada riwayat undian.</span>
          </div>
        `;
        return;
      }

      historyList.forEach((item) => {
        const row = document.createElement("div");
        row.className = "history-card";
        row.innerHTML = `
          <div style="min-width: 0; flex: 1;">
            <div class="hist-name">${item.name}</div>
            <div class="hist-meta">
              <span>📅 ${item.day}, ${item.date}</span>
              <span>•</span>
              <span>⏰ ${item.time} WIB</span>
            </div>
          </div>
          <div class="hist-chip">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            Terpilih
          </div>
        `;
        container.appendChild(row);
      });
    }

    window.editSantri = function(index) {
      const cur = santriList[index];
      const res = prompt("Ubah nama santri:", cur);
      if (res && res.trim() !== "") {
        santriList[index] = res.trim();
        saveData();
        drawWheel();
        renderSantriList();
      }
    };

    window.deleteSantri = function(index) {
      if (confirm(`Hapus "${santriList[index]}" dari daftar?`)) {
        santriList.splice(index, 1);
        saveData();
        drawWheel();
        renderSantriList();
      }
    };

    document.getElementById("addSantriForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("santriInput");
      const val = input.value.trim();
      if (val) {
        santriList.push(val);
        input.value = "";
        saveData();
        drawWheel();
        renderSantriList();
      }
    });

    document.getElementById("clearHistoryBtn").addEventListener("click", () => {
      if (historyList.length === 0) return;
      if (confirm("Kosongkan semua riwayat undian?")) {
        historyList = [];
        saveData();
        renderHistoryList();
      }
    });

    /* Formula Presisi Panah Atas (270 derajat) */
    function spinWheel() {
      if (isSpinning || santriList.length === 0) return;

      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;

      const N = santriList.length;
      const sliceDeg = 360 / N;

      const winnerIndex = Math.floor(Math.random() * N);
      activeWinnerIndex = winnerIndex;

      const midAngle = (winnerIndex + 0.5) * sliceDeg;

      let targetDeg = (270 - midAngle) % 360;
      if (targetDeg < 0) targetDeg += 360;

      const currentMod = currentRotation % 360;

      let forwardDelta = targetDeg - currentMod;
      if (forwardDelta < 0) forwardDelta += 360;

      const extraRounds = 360 * (6 + Math.floor(Math.random() * 2));
      const totalDelta = extraRounds + forwardDelta;

      currentRotation += totalDelta;
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;
        onSpinComplete(winnerIndex);
      }, 4500);
    }

    function onSpinComplete(index) {
      const winnerName = santriList[index];
      const now = new Date();

      const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

      const dayStr = days[now.getDay()];
      const dateStr = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      historyList.unshift({
        name: winnerName,
        day: dayStr,
        date: dateStr,
        time: timeStr
      });
      saveData();
      renderHistoryList();

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 140,
          spread: 80,
          origin: { y: 0.55 }
        });
      }

      document.getElementById("winnerNameDisplay").textContent = winnerName;
      document.getElementById("winnerTimeDisplay").textContent = `📅 ${dayStr}, ${dateStr} • ⏰ ${timeStr} WIB`;
      document.getElementById("winnerModal").classList.add("active");
    }

    document.getElementById("modalCloseBtn").addEventListener("click", () => {
      document.getElementById("winnerModal").classList.remove("active");
    });

    document.getElementById("modalRemoveBtn").addEventListener("click", () => {
      if (activeWinnerIndex >= 0 && activeWinnerIndex < santriList.length) {
        santriList.splice(activeWinnerIndex, 1);
        saveData();
        drawWheel();
        renderSantriList();
      }
      document.getElementById("winnerModal").classList.remove("active");
    });

    document.getElementById("spinBtn").addEventListener("click", spinWheel);
    document.getElementById("centerPinBtn").addEventListener("click", spinWheel);

    document.querySelectorAll(".tab-trigger").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-trigger").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));

        btn.classList.add("active");
        const target = btn.getAttribute("data-tab");
        document.getElementById(target).classList.add("active");
      });
    });

    loadData();
    drawWheel();
    renderSantriList();
    renderHistoryList();
    updateBadge();
  </script>
</body>
</html>
